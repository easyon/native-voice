name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/common
          python -m pip install -e "packages/tts_runtime[dev]"
          python -m pip install -e "packages/asr_runtime[dev]"
      - name: Lint
        run: |
          ruff check packages tests scripts
          bash -n deploy/bootstrap-gpu.sh
          bash -n deploy/prepare-bundle.sh
          bash -n scripts/gpu_env.sh
      - name: Test
        run: pytest -q

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/common packages/common
          python -m build --wheel --outdir dist/tts_runtime packages/tts_runtime
          python -m build --wheel --outdir dist/asr_runtime packages/asr_runtime
          python -m build --wheel --outdir dist/data packages/data
          python -m build --wheel --outdir dist/training packages/training
          python -m build --wheel --outdir dist/evaluation packages/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/**/*.whl

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU runtime image
        run: docker build --pull -t tts-runtime:ci .
      - name: Smoke test container
        run: |
          docker run -d --name runtime-ci -p 8000:8000 \
            -e COSYVOICE_API_KEYS=test-key tts-runtime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker logs runtime-ci
          exit 1
      - name: Build FunASR CPU image
        run: docker build --pull -f Dockerfile.asr -t funasr-runtime:ci .
      - name: Smoke test FunASR container
        run: |
          docker run -d --name funasr-ci -p 8001:8001 \
            -e FUNASR_API_KEYS=test-key funasr-runtime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/readyz; then exit 0; fi
            sleep 2
          done
          docker logs funasr-ci
          exit 1
