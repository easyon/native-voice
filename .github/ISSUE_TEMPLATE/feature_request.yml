name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你想解决什么问题？现在的限制是什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望接口、配置或行为是什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - ASR 模型 / 协议
        - TTS 模型 / 协议
        - 对话与打断
        - 网关 / 认证 / 配额
        - 网页客户端
        - 部署 / 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我愿意参与实现
          required: false
