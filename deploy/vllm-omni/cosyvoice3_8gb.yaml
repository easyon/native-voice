# Fun-CosyVoice3-0.5B on one 8 GB laptop GPU.
#
# Derived from vLLM-Omni's packaged `vllm_omni/deploy/cosyvoice3.yaml`
# (stage reservations 0.40 / 0.20, max_num_seqs 8, codec_chunk_frames 15,
# tuned for H100). The edits below are for a single 8 GB card that also hosts
# the streaming ASR engine:
#   * lower the per-stage reservations so ASR (~1.6 GB) still fits;
#   * max_num_seqs 2 (single conversation, avoids codec underruns);
#   * codec_chunk_frames 10 and enforce_eager on stage 0 to save both memory
#     and the AOT compile that needs z3/ptxas.
# These numbers are a starting point: tune with `nvidia-smi` on the target box.
# First bring-up on the RTX 4070 Laptop (8188 MiB) failed at 0.30 with
# "No available memory for the cache blocks" (stage 0 weights 0.95 GiB plus
# CUDA context left ~0 GiB for KV); 0.38/0.17 is the working split.
#
# If startup reports "No available memory for the cache blocks":
#   1. raise stage 0 (the talker needs its weights plus KV cache);
#   2. raise stage 1 if the flow-matching decoder is short on workspace;
#   3. keep enforce_eager: true on both stages;
#   4. leave max_num_seqs at 2.
pipeline: cosyvoice3
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 10
      codec_left_context_frames: 25
      codec_vocab_size: 6561

stages:
  - stage_id: 0
    # 32768 (the upstream H100 default) leaves too little activation memory on
    # an 8 GB card; one conversation needs only a few hundred text tokens.
    max_num_batched_tokens: 4096
    max_num_seqs: 2
    gpu_memory_utilization: 0.38
    # Eager mode skips AOT compilation (z3/ptxas) and CUDA-graph memory. Try
    # enforce_eager: false once startup is stable.
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
      top_k: 25
      top_p: 0.8
      repetition_penalty: 1.0001
    disable_hybrid_kv_cache_manager: true
    mm_processor_cache_gb: 0
    skip_mm_profiling: true

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 2
    gpu_memory_utilization: 0.17
    # Dynamic conv shapes keep CUDA graphs from working on this stage.
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_model_len: 32768
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
    disable_hybrid_kv_cache_manager: true
    skip_mm_profiling: true
