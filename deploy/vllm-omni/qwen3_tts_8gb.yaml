# Qwen3-TTS-12Hz-0.6B-Base on one 8 GB laptop GPU.
#
# This is the official two-stage Qwen3-TTS deploy config with the memory
# reservations lowered for an 8 GB card. Stage 0 is the talker, stage 1 is the
# code2wav decoder. Each stage reserves a fraction of total GPU memory; the
# remaining memory is shared with the ASR engine and the desktop.
#
# If startup reports "No available memory for the cache blocks":
#   1. raise stage 0 (the talker needs ~2.14 GiB for weights plus KV cache);
#   2. lower stage 1 to 0.12 if the code2wav stage has spare reservation;
#   3. set enforce_eager: true on both stages (saves CUDA graph memory, costs
#      some latency);
#   4. reduce max_num_seqs to 2.
#
# Measured on the 8 GB RTX 4070 Laptop: stage 0 needs >= 0.36 to fit 4096
# tokens of KV cache; 0.38 leaves a small margin. 0.30 failed with only 0.04
# GiB available KV cache.
model_runner: v2
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      decode_streaming: false
      talker_first_audio: true
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 4

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.38
    # Eager mode avoids the long AOT compile and its extra memory; measure
    # latency first, then try enforce_eager: false if startup is stable.
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05
    silence_ban_frames: 0
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    dtype: bfloat16
    max_num_seqs: 4
    gpu_memory_utilization: 0.17
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  rocm:
    model_runner: v1
    stages:
      - stage_id: 1
        enforce_eager: true
  npu:
    model_runner: v1
    stages:
      - stage_id: 0
        enforce_eager: false
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        compilation_config:
          cudagraph_mode: PIECEWISE
  xpu:
    model_runner: v1
    stages:
      - stage_id: 1
        enforce_eager: true
  musa:
    model_runner: v1
