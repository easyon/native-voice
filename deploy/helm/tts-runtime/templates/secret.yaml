{{- if not .Values.runtime.auth.existingSecret }}
{{- $apiKeys := required "runtime.auth.apiKeys is required (or set runtime.auth.existingSecret)" .Values.runtime.auth.apiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tts-runtime.fullname" . }}
  labels:
    {{- include "tts-runtime.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.runtime.auth.apiKeysKey }}: {{ $apiKeys | quote }}
  {{ .Values.runtime.auth.metricsTokenKey }}: {{ .Values.runtime.auth.metricsToken | quote }}
  {{ .Values.runtime.auth.storageSigningSecretKey }}: {{ .Values.runtime.auth.storageSigningSecret | quote }}
{{- end }}
