{{- $resources := deepCopy .Values.resources }}
{{- if .Values.gpu.enabled }}
{{- $limits := default (dict) $resources.limits }}
{{- $_ := set $limits "nvidia.com/gpu" .Values.gpu.count }}
{{- $_ := set $resources "limits" $limits }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosyvoice-runtime.fullname" . }}
  labels:
    {{- include "cosyvoice-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cosyvoice-runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cosyvoice-runtime.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cosyvoice-runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["cosyvoice-runtime"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: COSYVOICE_RUNTIME_CONFIG
              value: /etc/cosyvoice/runtime.yaml
            - name: COSYVOICE_ENVIRONMENT
              value: {{ .Values.runtime.environment | quote }}
            - name: COSYVOICE_LOG_FORMAT
              value: {{ .Values.runtime.logging.format | quote }}
            - name: COSYVOICE_LOG_LEVEL
              value: {{ .Values.runtime.logging.level | quote }}
            - name: COSYVOICE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "cosyvoice-runtime.secretName" . }}
                  key: {{ .Values.runtime.auth.apiKeysKey }}
            - name: COSYVOICE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cosyvoice-runtime.secretName" . }}
                  key: {{ .Values.runtime.auth.metricsTokenKey }}
                  optional: true
            - name: COSYVOICE_STORAGE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cosyvoice-runtime.secretName" . }}
                  key: {{ .Values.runtime.auth.storageSigningSecretKey }}
                  optional: true
            {{- if eq .Values.runtime.storage.type "local" }}
            - name: COSYVOICE_STORAGE_DIR
              value: {{ .Values.runtime.storage.dir | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          lifecycle:
            {{- toYaml .Values.lifecycle | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cosyvoice
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.runtime.storage.dir }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cosyvoice-runtime.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.emptyDir }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "cosyvoice-runtime.fullname" .)) .Values.persistence.existingClaim }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "cosyvoice-runtime.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
