# Values for a production gateway deployment.
#
# This chart defaults to the mock engine so it can be rolled out and smoke
# tested without a GPU. For the in-process CosyVoice engine set:
#   runtime.engine.type=cosyvoice
#   gpu.enabled=true
#   image.repository/tag to the GPU image built with `docker build --target gpu`
#
# For 100/1000 concurrency, prefer a CPU gateway (this chart) in front of a
# separate GPU model service. See docs/design/cosyvoice-runtime.md §8.5.

replicaCount: 2

image:
  repository: cosyvoice-runtime
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    # WebSocket and SSE need long-lived, unbuffered connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  hosts:
    - host: tts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

# In-process GPU engine only. Leave false for the CPU gateway.
gpu:
  enabled: false
  count: 1

nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

terminationGracePeriodSeconds: 30
minReadySeconds: 5
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# The image starts the process with cosyvoice-runtime; no shell is required.
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  # CPU is a coarse signal. Add a Pods/custom metric on
  # cosyvoice_active_streams (or queue wait) for connection-heavy traffic.
  # For one-GPU-per-pod model replicas, cosyvoice_gpu_utilization_ratio
  # (exported by the runtime from nvidia-smi) is a useful secondary signal;
  # see docs/ops/cosyvoice-runtime-runbook.md §4 for a Pods-metric example.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Local storage is node-local and not durable. Keep type=none for a
# multi-replica gateway and return base64 audio, or use a shared object store.
persistence:
  enabled: false   # enable when runtime.storage.type=local
  existingClaim: ""
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  emptyDir: false

networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

runtime:
  environment: prod
  serviceName: cosyvoice-runtime
  version: 0.1.0

  server:
    host: 0.0.0.0
    port: 8000
    requestTimeoutS: 120
    wsIdleTimeoutS: 23
    wsSendTimeoutS: 10
    maxRequestBytes: 1048576
    maxWsMessageBytes: 1048576
    maxWsConnections: 1000
    workerThreads: 32
    corsOrigins: []
    trustedHosts: []
    docsEnabled: false
    # Static browser test console at /ui. It authenticates API calls with the
    # key typed into the page; disable it if only the API should be exposed.
    uiEnabled: true
    accessLog: true
    proxyHeaders: true
    forwardedAllowIps: 127.0.0.1
    keepaliveTimeoutS: 5

  auth:
    # The runtime reads keys from the secret below via env overrides. Never
    # put real keys in values.yaml or the ConfigMap. Prefer creating the
    # Secret out-of-band and setting existingSecret.
    existingSecret: ""
    apiKeys: ""
    metricsToken: ""
    storageSigningSecret: ""
    apiKeysKey: api-keys
    metricsTokenKey: metrics-token
    storageSigningSecretKey: storage-signing-secret
    metricsPublic: false

  engine:
    type: mock
    mock:
      chunkMs: 200
      realtime: false
      amplitude: 0.12
    cosyvoice:
      loadJit: false
      # Accelerator stack (docs/ops/cosyvoice-runtime-runbook.md 7.3). Off by
      # default: enable only after GPU validation, and pre-generate
      # <artifact>/vllm / flow.decoder.estimator.fp32.<gpu>.plan because the
      # model volume is usually mounted read-only.
      loadVllm: false
      loadTrt: false
      trtConcurrent: 1
      fp16: false
      preload: true
      maxConcurrent: 8
      sampleRate: 24000
      queueSize: 64
      cancelGraceS: 2
      warmupText: "你好，欢迎使用语音合成服务。"

  models:
    my-tts-prod:
      engine: cosyvoice3
      artifact: /models/Fun-CosyVoice3-0.5B
      defaultVoice: voice-a
      sampleRate: 24000

  voices:
    voice-a:
      spkId: voice-a
      mode: sft
      instruct: "你是一个温柔、自然的助手。"
      promptWav: ""
      promptText: ""
      embedding: ""

  limits:
    maxTextChars: 20000
    maxTotalChars: 200000
    maxConcurrentStreams: 64
    acquireTimeoutS: 5
    sentenceTimeoutS: 60
    firstAudioTimeoutS: 10
    maxRequestS: 120
    maxTaskDurationS: 600
    shutdownTimeoutS: 10
    wsQueueSize: 32
    wsCancelTimeoutS: 5
    maxStreamAudioBytes: 67108864
    # Split long engine chunks before SSE/WS framing (0 disables).
    streamChunkBytes: 16384
    ssmlStrict: true

  storage:
    type: none
    dir: /app/data/audio
    baseUrl: ""
    ttlS: 86400
    serveFiles: false
    cleanupIntervalS: 3600

  # Zero-shot voice cloning uploads. Needs a writable dir; enable persistence
  # (or mount a volume at this path) when cloning is used in Kubernetes.
  cloning:
    enabled: true
    dir: /app/data/voices
    maxUploadBytes: 16777216
    minDurationS: 1.0
    maxDurationS: 30.0
    promptSampleRate: 24000

  logging:
    level: INFO
    format: json
    accessLog: true
