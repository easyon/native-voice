# Exact Python environment for the GPU runtime image (in-process CosyVoice3).
#
# This is a *freeze*, not a curated list: it is `pip list --local` output from
# the host where vLLM, TensorRT, wetext, the streaming path and the c=4
# benchmark were all validated (RTX 5090 32GB, driver 580.142, CUDA 13.0
# runtime, Python 3.12.13, 2026-11-13). Anything installed with pip on that host
# is pinned here, including the transitive closure that the curated locks leave
# to the resolver.
#
# INSTALL WITH --no-deps. vllm 0.19.1 declares opencv-python-headless>=4.13,
# which requires numpy>=2, while the CosyVoice engine stack is pinned to numpy
# 1.26.4 (scipy/librosa and the upstream checkpoint assume it). A dependency-
# resolving install therefore picks numpy 2.x or fails; this file is already a
# complete closure, so no resolution is needed:
#
#   python -m venv --system-site-packages /data/venvs/cosyvoice
#   /data/venvs/cosyvoice/bin/python -m pip install --no-deps -r requirements-gpu.lock
#
# (--system-site-packages reuses the conda torch; plain `venv` does not.)
#
# Prerequisites that must already exist in the base interpreter and are
# therefore absent here - assert them before installing:
#
#   torch==2.10.0+cu128  torchaudio==2.10.0+cu128  torchvision==0.25.0+cu128
#   triton==3.6.0  numpy==1.26.4  packaging==25.0  setuptools>=80,<81
#
# packages/runtime asserts the torch/torchaudio versions at import time.
#
# Excluded on purpose: pip, setuptools, wheel, uv (tooling), and the two
# editable packages (cosyvoice-common, cosyvoice-runtime) that the image
# installs from repo/packages. modelscope is absent: upstream imports it at
# module level but only calls snapshot_download for repo ids, and
# cosyvoice_runtime.engines.cosyvoice_compat.install_modelscope_stub() satisfies
# the import for local checkpoints.
#
# Reproduce/refresh: on a validated host run
#   pip list --local --format=freeze | grep -vE '^(pip|uv|setuptools|wheel|cosyvoice-)'
# and diff the result against the block below.

