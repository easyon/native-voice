# Optional accelerator stack for the in-process CosyVoice3 engine.
#
#   pip install -r requirements-accel.lock     # both vLLM and TensorRT
#
# This file resolves. For a byte-identical GPU environment use
# requirements-gpu.lock instead: it is the full `pip list --local` closure of
# the host where both stacks were validated, installed with --no-deps. The two
# curated lists below are kept because they document what each accelerator
# changes relative to the fp32 baseline (vLLM upgrades transformers and pins
# torch; TensorRT is tied to the CUDA build), and because one can be used
# without the other.
#
# Rationale: upstream CosyVoice3 runs the LLM on one shared CUDA stream and
# the flow decoder is a large DiT. vLLM gives continuous batching for the
# token generation and TensorRT accelerates the estimator; both are the
# vendor-supported paths, not local patches.

-r requirements-vllm.lock
-r requirements-trt.lock
