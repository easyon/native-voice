[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-runtime"
version = "0.1.0"
description = "Bailian-compatible CosyVoice TTS HTTP/SSE/WebSocket runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "cosyvoice-common>=0.1.0,<0.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  # Multipart parsing for the voice-cloning upload endpoint.
  "python-multipart>=0.0.9,<1",
  # Used by the PCM gain path and the CosyVoice worker. Keeping it in the
  # base runtime avoids a slow Python-loop fallback under load.
  "numpy>=1.26",
]

[project.optional-dependencies]
# In-process engine only; the gateway itself never imports torch.
cosyvoice = [
  "torch>=2.1",
  "onnxruntime>=1.17",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6",
  "websockets>=12",
  # Official SDK conformance regression (tests/tts_runtime/test_dashscope_compat.py).
  "dashscope>=2.0,<3",
]

[project.scripts]
tts-runtime = "tts_runtime.main:run"

[tool.setuptools.packages.find]
where = ["src"]

# The /ui test console is a single self-contained HTML file.
[tool.setuptools.package-data]
tts_runtime = ["web/*.html"]
