[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosyvoice-training"
version = "0.1.0"
description = "CosyVoice SFT, Flow and HiFiGAN training"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "cosyvoice-common>=0.1.0,<0.2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Keep torch/DeepSpeed out of the default install. Runtime never installs this
# project, so the runtime image cannot pick up training dependencies.
sft = [
  "torch>=2.1",
  "numpy>=1.26",
  "tqdm>=4.66",
]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
