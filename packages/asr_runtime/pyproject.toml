[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-runtime"
version = "0.1.0"
description = "Bailian-compatible FunASR realtime WebSocket runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "cosyvoice-common>=0.1.0,<0.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  # Multipart parsing for /v1/audio/transcriptions.
  "python-multipart>=0.0.9,<1",
  # PCM/WAV framing and the energy VAD. The FunASR engine itself is optional.
  "numpy>=1.26",
]

[project.optional-dependencies]
# In-process FunASR engine. The gateway and the mock/llamacpp engines never
# import torch.
funasr = [
  "funasr>=1.2,<2",
  "modelscope>=1.20",
  "torch>=2.1",
  "torchaudio>=2.1",
  "soundfile>=0.12",
  "transformers>=4.40",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6",
  "websockets>=12",
]

[project.scripts]
funasr-runtime = "funasr_runtime.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
funasr_runtime = ["py.typed", "web/*.html"]
