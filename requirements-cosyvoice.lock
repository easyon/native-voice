# In-process CosyVoice3 engine dependencies (GPU image only).
#
# Verified on 2026-11-12 against A100 + CUDA 12.8 / Python 3.12:
#   torch 2.10.0+cu128, torchaudio 2.10.0  (from conda, NOT listed here)
#   transformers 4.51.3
#   onnxruntime-gpu 1.20.2   (1.31.x needs CUDA 13 -> libcublasLt.so.13)
#   protobuf>=4.25.8, flatbuffers, soundfile
#
# torch and torchaudio are intentionally absent: they come from the conda
# environment created by deploy/docker/conda-torch.yaml. The Dockerfile
# asserts their versions after pip install, so a pip resolver cannot silently
# replace them.
#
# Install order in the GPU image:
#   pip install -r requirements-runtime.lock      # gateway deps, numpy 2.x
#   pip install -r requirements-cosyvoice.lock    # engine deps, numpy 1.26.4
#
# TODO: this is a direct-pin lock, not a full hash lock. The transitive
# closure of librosa/wetext/diffusers is resolved by pip. On the verified GPU
# host run `pip freeze > requirements-cosyvoice.freeze.txt` (or
# `pip-compile --generate-hashes`) and fold the result in before declaring the
# image reproducible. Packages whose exact host version was not recorded are
# marked TODO below; the pin is a known-published version that satisfies the
# verified direct pins.

