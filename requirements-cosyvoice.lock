# wetext 0.2.1 ships every grammar in wetext/fsts (149 files, 34MB wheel), so
# Normalizer() no longer calls modelscope.snapshot_download at runtime. This
# replaces upstream's wetext==0.0.4, whose first use made an authenticated
# ModelScope request and left the engine with "no frontend is avaliable" in
# private networks. Normalizer(remove_erhua=False)/Normalizer() stay
