# CPU gateway / shared runtime dependencies.
#
# Source of truth: `pip freeze` of the repository dev venv on 2026-11-12,
# plus PyPI checks that every pin has a Linux cp312 wheel (or a pure-Python
# wheel). `uvloop` is Linux-only and therefore absent from the Windows dev
# freeze; 0.21.0 is the current uvicorn[standard] companion.
#
# Install before the local packages:
#   pip install -r requirements-runtime.lock
#   pip install --no-deps /wheels/*.whl
#
# This file intentionally has no torch/onnxruntime entries. The GPU image gets
# torch from conda and engine dependencies from requirements-cosyvoice.lock.
#
# TODO: regenerate with hashes on a networked Linux host. numpy 2.4.6 and
# recent wheels are tagged manylinux_2_27/2_28 (Ubuntu 22.04 glibc 2.35 and
# Debian bookworm glibc 2.36 both accept them), so pass both platform tags:
#   pip download --only-binary=:all: \
#     --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
#     --python-version 3.12 --implementation cp --abi cp312 \
#     -d wheelhouse -r requirements-runtime.lock
#   pip hash wheelhouse/*.whl > wheelhouse/SHA256SUMS

