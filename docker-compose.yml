services:
  cosyvoice-runtime:
    build: .
    image: cosyvoice-runtime:dev
    init: true
    ports:
      - "8000:8000"
    environment:
      COSYVOICE_RUNTIME_CONFIG: /app/configs/runtime.yaml
      COSYVOICE_LOG_LEVEL: INFO
      # Set a real key here for local auth testing.
      COSYVOICE_API_KEYS: ""
    volumes:
      - audio:/app/data/audio
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  audio:
