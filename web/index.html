<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Native Voice · 实时语音对话</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234cc2ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("nv_theme");
      var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.setAttribute("data-theme", saved || (light ? "light" : "dark"));
    })();
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12h2M7.5 8v8M12 4.5v15M16.5 8v8M21 12h-2"/></svg>
      </span>
      <div class="brand-text">
        <strong>Native Voice</strong>
        <small>本地私有化 · 全双工实时对话</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="theme-toggle" type="button" aria-label="切换主题" title="切换亮色/暗色">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
        </svg>
      </button>
      <div class="status-pill">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card prompt-card">
        <div class="card-title-row">
          <h2>角色提示词</h2>
          <span id="promptCount" class="muted">0 / 2000</span>
        </div>
        <textarea id="systemPrompt" rows="5" maxlength="2000"
          placeholder="例如：你是一位耐心、简洁的私人助理，回答不超过两句话。"></textarea>
        <div class="prompt-row">
          <button id="applyPrompt">应用</button>
        </div>
      </section>

      <section class="card">
        <h2>通话设置</h2>
        <label>API Key
          <input id="apiKey" type="password" autocomplete="off" placeholder="nv_..." />
        </label>
        <label>音色
          <div class="voice-row">
            <select id="voice"><option value="default">default</option></select>
            <button id="cloneOpenBtn" type="button" class="ghost clone-open">＋ 克隆</button>
          </div>
        </label>
        <label>判停静音
          <select id="endpointMs">
            <option value="200">200 ms（最快，易截断）</option>
            <option value="300" selected>300 ms（推荐）</option>
            <option value="400">400 ms（稳）</option>
            <option value="600">600 ms（很稳）</option>
          </select>
        </label>
      </section>

    </aside>

    <section class="card call-stage">
      <div class="call-head">
        <span id="callState" class="state-pill">空闲</span>
        <span id="callTimer" class="call-timer">00:00</span>
      </div>

      <div class="call-hero">
        <div class="orb-stage idle" id="orbStage" aria-hidden="true">
          <span class="orb-halo"></span>
          <span class="orb-ring r1"></span>
          <span class="orb-ring r2"></span>
          <span class="orb-ring r3"></span>
          <canvas class="orb-core" id="orb"></canvas>
        </div>
        <canvas id="audioWave" class="wave" aria-label="麦克风输入波形"></canvas>
        <div class="call-hero-text">
          <div id="liveUser" class="live-caption user-line" aria-live="polite"></div>
          <div id="liveCaption" class="live-caption ai-line" aria-live="polite"></div>
        </div>
      </div>

      <div class="call-log">
        <div class="log-head">
          <span class="log-title">转写记录</span>
          <button id="clearBtn" class="ghost" type="button">清空</button>
        </div>
        <div id="transcript" class="transcript"></div>
        <div id="partial" class="partial" hidden></div>
        <div id="error" class="error" hidden></div>
      </div>

      <div class="call-controls">
        <div class="control-slot">
          <button id="micBtn" class="round-control" type="button" disabled
            aria-label="麦克风" title="麦克风">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path>
            </svg>
          </button>
          <span class="control-label">麦克风</span>
        </div>

        <div class="call-control-main">
          <button id="callBtn" class="call-button" type="button" aria-label="呼叫">
            <svg class="icon-call" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.6 3.8 9.2 3a1.5 1.5 0 0 1 1.7.8l1.4 2.8a1.5 1.5 0 0 1-.3 1.8l-1.4 1.3a14 14 0 0 0 5.7 5.7l1.3-1.4a1.5 1.5 0 0 1 1.8-.3l2.8 1.4a1.5 1.5 0 0 1 .8 1.7l-.8 2.6a2.5 2.5 0 0 1-2.6 1.8C10.7 20.3 3.7 13.3 2.8 6.4a2.5 2.5 0 0 1 1.8-2.6Z"></path>
            </svg>
            <svg class="icon-hangup" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.2 15.9a2.4 2.4 0 0 1 .2-3.3 13.7 13.7 0 0 1 15.2 0 2.4 2.4 0 0 1 .2 3.3l-1.2 1.3a1.5 1.5 0 0 1-2 .1l-2.2-1.7a1.5 1.5 0 0 1-.5-1.7l.4-1.1a10.8 10.8 0 0 0-4.6 0l.4 1.1a1.5 1.5 0 0 1-.5 1.7l-2.2 1.7a1.5 1.5 0 0 1-2-.1Z"></path>
            </svg>
          </button>
          <span id="callLabel" class="call-label">呼叫</span>
        </div>

        <div class="control-slot">
          <button id="logToggle" class="round-control" type="button" aria-pressed="false"
            aria-label="转写记录" title="切换到转写记录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h10"></path>
            </svg>
          </button>
          <span class="control-label">转写</span>
        </div>
      </div>
    </section>

    <aside class="sidebar metrics-side">
      <section class="card">
        <h2>本轮时延</h2>
        <div id="latestLatency" class="latency-empty">等待第一轮对话…</div>
        <div class="bars" id="latencyBars"></div>
      </section>

      <section class="card">
        <h2>会话指标</h2>
        <div class="metrics-grid">
          <div><span id="turnsCount">0</span><small>轮次</small></div>
          <div><span id="p50">-</span><small>p50 说完→首音频</small></div>
          <div><span id="p95">-</span><small>p95</small></div>
          <div><span id="activeSessions">-</span><small>服务端活跃会话</small></div>
        </div>
        <table class="turns">
          <thead><tr><th>#</th><th>端点</th><th>ASR</th><th>LLM</th><th>TTS</th><th>总计</th></tr></thead>
          <tbody id="turnRows"></tbody>
        </table>
      </section>
    </aside>
  </main>

  <footer class="footer">Native Voice · 百炼兼容 ASR/TTS API + 全双工对话 API</footer>

  <dialog id="cloneDialog" class="clone-dialog" aria-labelledby="cloneTitle">
    <div class="dialog-head">
      <div>
        <h2 id="cloneTitle">克隆音色</h2>
        <p class="hint">录一段 3–10 秒的清晰人声，或上传参考音频；请在安静环境录制，避免录到 AI 声音。</p>
      </div>
      <button id="cloneCloseBtn" type="button" class="icon-close" aria-label="关闭">×</button>
    </div>

    <div class="dialog-body">
      <div class="record-row">
        <button id="recordBtn" type="button">开始录音</button>
        <button id="clearRecordBtn" type="button" class="ghost">清除</button>
      </div>
      <div id="recordStatus" class="hint">未录音 · 建议 3–10 秒</div>

      <label>或上传参考音频（wav/flac/mp3/ogg）
        <input id="cloneFile" type="file" accept=".wav,.flac,.mp3,.ogg,audio/*" />
      </label>
      <label>音色名称
        <input id="cloneName" maxlength="40" placeholder="例如：我的声音" />
      </label>
      <label>参考文字（留空自动识别）
        <textarea id="cloneText" rows="3" maxlength="500"
          placeholder="参考音频里说的内容；留空会用本地 ASR 自动转写"></textarea>
      </label>
      <label class="consent"><input id="cloneConsent" type="checkbox" /> 我确认拥有该声音的使用授权</label>
    </div>

    <div class="dialog-footer">
      <button id="deleteVoiceBtn" type="button" class="ghost">删除当前克隆音色</button>
      <button id="cloneBtn" type="button" class="primary">上传并克隆</button>
    </div>
    <div id="cloneStatus" class="hint dialog-status"></div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
