# FunASR realtime engine dependencies (CPU and GPU images).
#
# This is a curated constraint set, not a full freeze: regenerate on the target
# Linux host after validating a model/GPU combination:
#   pip freeze > requirements-funasr.freeze.txt
#
# torch/torchaudio are intentionally absent. The GPU image takes them from the
# conda environment (CUDA 12.8 build) and the CPU image installs the matching
# CPU wheels explicitly; pip-installing a CUDA torch wheel by accident is the
# most common cause of a silently CPU-only deployment.
#
# Install order:
#   pip install -r requirements-runtime.lock
#   pip install -r requirements-funasr.lock
#   pip install --no-deps /wheels/*.whl

