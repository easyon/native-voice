service_name: funasr-runtime
version: 0.1.0
environment: prod

server:
  host: 0.0.0.0
  port: 8001
  ws_idle_timeout_s: 23
  max_ws_connections: 1000
  worker_threads: 8
  docs_enabled: false
  ui_enabled: true
  access_log: true

auth:
  enabled: false
  api_keys: []
  tenants: []
  metrics_public: false
  metrics_token: ""

engine:
  type: llamacpp
  vad:
    # CPU/edge realtime endpointing without torch.
    type: energy
    energy_threshold_db: -40
    frame_ms: 20
    pre_roll_ms: 200
  llamacpp:
    # Mount the funasr-llamacpp release here.
    binary_dir: /opt/funasr/bin
    binaries:
      fun-asr-nano: llama-funasr-cli
      paraformer: llama-funasr-paraformer
      sensevoice: llama-funasr-sensevoice
    args: ["{binary}", "-m", "{model}", "-a", "{audio}"]
    timeout_s: 120
    max_processes: 1
    # Each partial decode starts a process and reloads the model. Keep 0 for
    # realtime; set >0 only for short audio and low concurrency.
    partial_interval_ms: 0

models:
  fun-asr-realtime:
    engine: llamacpp
    architecture: fun-asr-nano
    artifact: /models/fun-asr-nano-llm-q8.gguf
    encoder_artifact: /models/fun-asr-nano-encoder-f16.gguf
    vad_artifact: /models/fsmn-vad.gguf
  paraformer-realtime:
    engine: llamacpp
    architecture: paraformer
    artifact: /models/paraformer-q8.gguf
    vad_artifact: /models/fsmn-vad.gguf
  sensevoice-realtime:
    engine: llamacpp
    architecture: sensevoice
    artifact: /models/sensevoice-small-q8.gguf
    vad_artifact: /models/fsmn-vad.gguf

aliases:
  whisper-1: fun-asr-realtime

offline:
  default_model: fun-asr-realtime
  max_upload_bytes: 104857600
  max_duration_s: 3600

limits:
  max_concurrent_streams: 4
  max_task_duration_s: 3600
  heartbeat_interval_ms: 5000
  finish_timeout_s: 30
  max_segment_ms: 30000
  min_speech_ms: 200
  shutdown_timeout_s: 10

logging:
  level: INFO
  format: json
  access_log: true
